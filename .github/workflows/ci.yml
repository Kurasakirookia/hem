# Every push to main and every pull request. Three jobs run in parallel.
# The list of checks and why each exists is in docs/testing.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.29.2
  NODE_VERSION: 20

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (fails if the lockfile is out of date)
        run: pnpm install --frozen-lockfile
      - name: Token gate (no literal design values in components)
        run: node ../scripts/check-tokens.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm exec tsc -b
      - name: Unit tests, 80% coverage on lib and hooks
        run: pnpm exec vitest run --coverage
      - name: Production build
        run: pnpm exec vite build
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install (fails if the lockfile is out of date)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests, 80% coverage
        run: uv run pytest --cov
      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

  e2e:
    runs-on: ubuntu-latest
    # Same image as `pnpm e2e:docker` and `pnpm baseline`, so browsers and
    # fonts render the same here as in the docker pair. Keep the version in
    # step with @playwright/test.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile
      # The visual baseline is skipped here. Committed baselines come from the
      # host pair, and this machine renders fonts differently, so every run
      # would fail. To turn it on: run `pnpm baseline` once, commit the PNGs,
      # use `pnpm e2e:docker` locally from then on, and drop --grep-invert.
      # See docs/frontend-harness.md, Gate 5.
      - name: Smoke tests (routes render, no console errors)
        run: pnpm exec playwright test --grep-invert "visual baseline"
      - name: Upload failure traces and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
